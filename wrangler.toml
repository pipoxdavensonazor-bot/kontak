name = "kontak"
main = "src/worker.js"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

# Faster builds
minify = true

[[durable_objects.bindings]]
name = "KONTAK"
class_name = "KontakRoom"

[exports.KontakRoom]
type = "durable-object"
storage = "sqlite"

# Secrets (never in this file): set with `npx wrangler secret put <NAME>`
#   VAPID_PUBLIC, VAPID_JWK        -> push notifications (npm run vapid:gen)
#   TURN_KEY_ID, TURN_API_TOKEN    -> optional Cloudflare Calls TURN (STUN only without them)
#   BIRD_ACCESS_KEY                -> Bird workspace API key (sms:write). Without it, SMS verification is off.
# Local dev: put them in .dev.vars (git-ignored).
# Email verification uses the send_email binding + EMAIL_FROM (no API key).

[vars]
BIRD_WORKSPACE_ID = "ws_01m82yzv1zf7stwgm60a109kt8"
BIRD_SENDER = "KONTAK"
EMAIL_FROM = "Kontak <no-reply@klirline.ca>"
# Optional: BIRD_CHANNEL_ID (not required by the current Bird SMS API)
# Optional: BIRD_API_HOST, otherwise inferred from the key prefix (bk_us1_ / bk_eu1_)

[[send_email]]
name = "EMAIL"

[previews.vars]
SMS_FAKE_SENDER = "1"
EMAIL_FAKE_SENDER = "1"
BIRD_WORKSPACE_ID = "ws_01m82yzv1zf7stwgm60a109kt8"
BIRD_SENDER = "KONTAK"
EMAIL_FROM = "Kontak <no-reply@klirline.ca>"

# Assets
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "kontak"
database_id = "54fcd242-55db-4a79-be1e-21ee6a62b159"
migrations_dir = "migrations"

# Voice notes and photos (private bucket, served only through /media/<id> to conversation members)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kontak-media"

# Workers Builds branch Previews (`wrangler preview`): never touch production data.
# Each Preview gets its own Durable Object namespace automatically; D1 points to a
# separate database (kontak-preview, migrations applied independently of production).
[[previews.durable_objects.bindings]]
name = "KONTAK"
class_name = "KontakRoom"

[[previews.d1_databases]]
binding = "DB"
database_name = "kontak-preview"
database_id = "1361776c-e8a9-4b50-9e8e-a285ee901096"
migrations_dir = "migrations"

[[previews.r2_buckets]]
binding = "MEDIA"
bucket_name = "kontak-media-preview"
