name = "kontak"
main = "src/worker.js"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

# Faster builds
minify = true

[[durable_objects.bindings]]
name = "KONTAK"
class_name = "KontakRoom"

[exports.KontakRoom]
type = "durable-object"
storage = "sqlite"

# D1 database (remplace TON_ID après création)
[[d1_databases]]
binding = "DB"
database_name = "kontak-db"
database_id = "TON_ID_ICI"
migrations_dir = "migrations"

