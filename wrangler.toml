name = "kontak"
main = "src/worker.js"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

# Faster builds
minify = true

[[durable_objects.bindings]]
name = "KONTAK"
class_name = "KontakRoom"

[exports.KontakRoom]
type = "durable-object"
storage = "sqlite"

# Assets
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "kontak-db"
database_id = "54fcd242-55db-4a79-be1e-21ee6a62b159"
migrations_dir = "migrations"
