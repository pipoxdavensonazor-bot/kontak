name = "kontak"
main = "src/worker.js"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

# Faster builds
minify = true

[[durable_objects.bindings]]
name = "KONTAK"
class_name = "KontakRoom"

[exports.KontakRoom]
type = "durable-object"
storage = "sqlite"

# Secrets (never in this file): set with `npx wrangler secret put <NAME>`
#   VAPID_PUBLIC, VAPID_JWK        -> push notifications (npm run vapid:gen)
#   TURN_KEY_ID, TURN_API_TOKEN    -> optional Cloudflare Calls TURN (STUN only without them)
# Local dev: put them in .dev.vars (git-ignored).

# Assets
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "kontak"
database_id = "54fcd242-55db-4a79-be1e-21ee6a62b159"
migrations_dir = "migrations"

# Workers Builds branch Previews (`wrangler preview`): never touch production data.
# Each Preview gets its own Durable Object namespace automatically; D1 points to a
# separate database (kontak-preview, migrations 0001-0004 applied).
[[previews.durable_objects.bindings]]
name = "KONTAK"
class_name = "KontakRoom"

[[previews.d1_databases]]
binding = "DB"
database_name = "kontak-preview"
database_id = "1361776c-e8a9-4b50-9e8e-a285ee901096"
migrations_dir = "migrations"
